<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="../../favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="../../style.css">
	<title>CSV plotter</title>
	<style>
		#main-ui * {
			margin-top: unset;
			margin-bottom: unset;
		}

		#dropzone {
			border: 1px solid #8F8F9D;
			padding: 4px 4px;
			text-align: center;
			cursor: pointer;
			background: #E9E9ED;
			border-radius: 3px;
		}

		#dropzone:hover {
			filter: brightness(0.92);
		}

		.flex-col {
			display: flex;
			flex-direction: column;
			gap: 5px;
			margin-top: 5px;
		}

		.control-group {
			max-width: 100%;
		}

		#lineSettings {
			overflow-x: auto;
			max-width: 100%;
			gap: 8px;
		}

		.label-block {
			width: 100%;
			display: grid;
			grid-template-columns: max-content 1fr max-content 1fr;
			gap: 0px 4px;
			align-items: center;
		}

		.label-block input {
			width: 100%;
			box-sizing: border-box;
		}

		.label-block label {
			box-sizing: border-box;
		}

		.controls-inline {
			display: flex;
			align-items: center;
			width: 100%;
			white-space: nowrap;
			gap: 4px;
		}

		.controls-inline select {
			flex: 1;
		}
	</style>
</head>

<body>
	<header>
		<a href="../../index.html">home</a>
		<a href="../blog.html">blog</a>
		<a href="../showcase.html">show</a>
		<a href="../homelab.html">lab</a>
		<a href="../favourites.html">fav</a>
		<a href="../resources.html">res</a>
		<a href="../ideas.html">ideas</a>
		<a href="../tools.html">tools</a>
	</header>
	<h1>CSV plotter</h1>

	<div>
		<div class="control-group">
			<div id="dropzone" style="margin-top: 5px;">
				<span id="dropText">drop a CSV file here<br>or click to upload</span>
				<input type="file" id="fileInput" accept=".csv" style="display: none;">
			</div>
		</div>
	</div>

	<div id="main-ui" style="display: none;">
		<div style="display: flex; flex-wrap: wrap;">

			<div class="controls-inline" style="margin-bottom: 4px;">
				<label><input type="checkbox" id="showXGrid" onchange="generate_plot()" checked> x grid</label>
				<label><input type="checkbox" id="showYGrid" onchange="generate_plot()" checked> y grid</label>
				<label><input type="checkbox" id="intTicksOnly" onchange="generate_plot()"> int ticks</label>
				x dens (<span id="xDenVal">8</span>):
				<input type="range" id="xTickDensity" min="2" max="25" value="8"
					oninput="document.getElementById('xDenVal').innerText=this.value; generate_plot();"
					style="flex:1; min-width:50px;">
				y dens (<span id="yDenVal">6</span>):
				<input type="range" id="yTickDensity" min="2" max="25" value="6"
					oninput="document.getElementById('yDenVal').innerText=this.value; generate_plot();"
					style="flex:1; min-width:50px;">
			</div>

			<div class="label-block">
				<label>top label:</label>
				<input type="text" id="labelTop" oninput="generate_plot()" value="top title">

				<label>bottom label:</label>
				<input type="text" id="labelBottom" oninput="generate_plot()" value="bottom axis">

				<label>left label:</label>
				<input type="text" id="labelLeft" oninput="generate_plot()" value="left axis">

				<label>right label:</label>
				<input type="text" id="labelRight" oninput="generate_plot()">
			</div>

			<div class="controls-inline" style="margin-top: 4px; margin-bottom: 4px;">
				color preset:
				<select id="colorPreset" onchange="apply_color_preset()">
					<option value="blues">blue</option>
					<option value="reds">red</option>
					<option value="greens">green</option>
					<option value="grayscale">grayscale</option>
					<option value="rainbow">rainbow</option>
				</select>
				scale:
				<select id="scaleMethod" onchange="generate_plot()">
					<option value="linear">linear (real)</option>
					<option value="logY">logarithmic Y</option>
					<option value="logX">logarithmic X</option>
					<option value="logXY">logarithmic X & Y</option>
				</select>
				legend:
				<select id="legendPos" onchange="generate_plot()">
					<option value="topRight">top right</option>
					<option value="topLeft">top left</option>
					<option value="none">none</option>
				</select>
			</div>

			<div id="lineSettings" style="display: flex; gap: 4px;"></div>
		</div>

		<div id="plotContainer"
			style="width: 100%; height: 380px; margin-top: 4px; border: 1px solid #8F8F9D; box-sizing: border-box;">
		</div>

		<div
			style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; margin-bottom: 4px;">
			<div>
				<h3 style="display: inline;">HTML snippet:</h3>
			</div>
			<div>
				<label><input type="checkbox" id="exportStyles" onchange="generate_plot()" checked> add default style</label>
				<button id="copyBtn" onclick="copy_snippet()">copy</button>
			</div>
		</div>
		<textarea id="outputCode" rows="5" style="width: 100%; resize: none; box-sizing: border-box;" readonly></textarea>
	</div>

	<script>
		const plot_config = {
			pad_top: 20,
			pad_bottom: 37,
			pad_right: 20,
			min_pad_left: 37,
			y_axis_text_gap: 8,
			x_axis_text_gap: 7,
			label_offset_top: "-2px",
			label_offset_bottom: "-2px",
			label_offset_left: "7px",
			label_offset_right: "7px"
		};

		const default_colors = ["#e41a1c", "#377eb8", "#4daf4a", "#984ea3", "#ff7f00", "#000000"];
		let line_configs = {};
		let parsed_series = [];
		let current_csv_text = "";

		window.addEventListener('resize', generate_plot);
		window.onload = () => {
			setup_drag_and_drop();
		};

		function setup_drag_and_drop() {
			const dropzone = document.getElementById('dropzone');
			const file_input = document.getElementById('fileInput');

			dropzone.addEventListener('click', () => file_input.click());
			dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = '#4daf4a'; dropzone.style.background = '#eafaea'; });
			dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#aaa'; dropzone.style.background = '#fafafa'; });
			dropzone.addEventListener('drop', (e) => {
				e.preventDefault();
				dropzone.style.borderColor = '#aaa';
				dropzone.style.background = '#fafafa';
				if (e.dataTransfer.files.length) handle_file(e.dataTransfer.files[0]);
			});

			file_input.addEventListener('change', (e) => {
				if (e.target.files.length) handle_file(e.target.files[0]);
			});
		}

		function handle_file(file) {
			const reader = new FileReader();
			reader.onload = (e) => {
				current_csv_text = e.target.result;
				document.getElementById('dropText').innerHTML = `<strong>Loaded:</strong> ${file.name}<br>click or drop to replace`;
				document.getElementById('main-ui').style.display = 'block';
				parse_and_generate();
			};
			reader.readAsText(file);
		}

		function hsl_to_hex(h, s, l) {
			l /= 100;
			const a = s * Math.min(l, 1 - l) / 100;
			const f = n => {
				const k = (n + h / 30) % 12;
				const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
				return Math.round(255 * color).toString(16).padStart(2, '0');
			};
			return `#${f(0)}${f(8)}${f(4)}`;
		}

		function format_number(val) {
			if (val === 0) return "0";
			let abs = Math.abs(val);
			if (abs >= 10000 || (abs < 0.01 && abs > 0)) {
				return val.toExponential(2).replace(/\+/, '');
			}
			return parseFloat(val.toFixed(2)).toString();
		}

		function calculate_ticks(min, max, max_ticks, int_only) {
			if (min === max) return [min];
			function nice_num(range, round) {
				const exponent = Math.floor(Math.log10(range));
				const fraction = range / Math.pow(10, exponent);
				let nice_frac;
				if (round) {
					if (fraction < 1.5) nice_frac = 1; else if (fraction < 3) nice_frac = 2; else if (fraction < 7) nice_frac = 5; else nice_frac = 10;
				} else {
					if (fraction <= 1) nice_frac = 1; else if (fraction <= 2) nice_frac = 2; else if (fraction <= 5) nice_frac = 5; else nice_frac = 10;
				}
				return nice_frac * Math.pow(10, exponent);
			}

			const range = nice_num(max - min, false);
			let tick_spacing = nice_num(range / (max_ticks - 1), true);

			if (int_only) {
				if (tick_spacing < 1) tick_spacing = 1;
				else tick_spacing = Math.max(1, Math.round(tick_spacing));
			}

			let nice_min = Math.floor(min / tick_spacing) * tick_spacing;
			let nice_max = Math.ceil(max / tick_spacing) * tick_spacing;

			const ticks = [];
			for (let i = nice_min; i <= nice_max + 1e-10; i += tick_spacing) {
				let val = i;
				if (int_only) val = Math.round(val);
				if (val >= min && val <= max) {
					if (!ticks.includes(val)) ticks.push(val);
				}
			}
			return ticks;
		}

		function parse_and_generate() {
			if (!current_csv_text) return;

			const lines = current_csv_text.split('\n').filter(l => l.trim() !== '');
			if (lines.length < 2) return;

			const headers = lines[0].split(',').map(s => s.trim());
			const y_headers = headers.slice(1);
			parsed_series = y_headers.map(h => ({ name: h, points: [] }));

			for (let i = 1; i < lines.length; i++) {
				const cols = lines[i].split(',');
				const x_val = parseFloat(cols[0]);
				if (isNaN(x_val)) continue;

				for (let j = 0; j < y_headers.length; j++) {
					const y_val = parseFloat(cols[j + 1]);
					if (!isNaN(y_val)) parsed_series[j].points.push({ x: x_val, y: y_val });
				}
			}

			y_headers.forEach((name, idx) => {
				if (!line_configs[name]) {
					line_configs[name] = { color: default_colors[idx % default_colors.length], style: 'solid', width: 2.5 };
				}
			});

			build_settings_ui();
			generate_plot();
		}

		function apply_color_preset() {
			const preset = document.getElementById('colorPreset').value;
			const n = parsed_series.length;
			if (n === 0) return;

			parsed_series.forEach((s, i) => {
				let hex = "#000000";
				let t = n > 1 ? i / (n - 1) : 0.5;
				switch (preset) {
					case 'blues': hex = hsl_to_hex(210, 80, 20 + (1 - t) * 60); break;
					case 'reds': hex = hsl_to_hex(0, 80, 20 + (1 - t) * 60); break;
					case 'greens': hex = hsl_to_hex(120, 70, 20 + (1 - t) * 50); break;
					case 'grayscale': hex = hsl_to_hex(0, 0, 15 + (1 - t) * 65); break;
					case 'rainbow': hex = hsl_to_hex(i * (360 / n), 80, 45); break;
				}
				line_configs[s.name].color = hex;
			});
			build_settings_ui();
			generate_plot();
		}

		function rename_series(old_name, new_name) {
			new_name = new_name.trim();

			if (!new_name || old_name === new_name) {
				build_settings_ui();
				return;
			}

			if (line_configs[new_name]) {
				alert("a series with this name already exists!");
				build_settings_ui();
				return;
			}

			line_configs[new_name] = line_configs[old_name];
			delete line_configs[old_name];

			const series = parsed_series.find(s => s.name === old_name);
			if (series) {
				series.name = new_name;
			}

			build_settings_ui();
			generate_plot();
		}

		function build_settings_ui() {
			let html = '';
			parsed_series.forEach(s => {
				let conf = line_configs[s.name];

				// Escape quotes so HTML rendering doesn't break if a user types them
				let safe_name_obj = s.name.replace(/"/g, '&quot;');
				let safe_name_js = s.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

				html += `
								<div style="border: 1px solid #8F8F9D; padding: 2px; display: flex; flex-direction: column; gap: 0px; width: 98px; flex-shrink: 0;">
									<input type="text" value="${safe_name_obj}" onchange="rename_series('${safe_name_js}', this.value)" title="Edit series name">
										<div style="display: flex; align-items: center;">
												<span>color:</span>
												<input type="color" value="${conf.color}" onchange="update_line_conf('${safe_name_js}', 'color', this.value)" style="height: 20px; padding: 0;">
										</div>
										<div style="display: flex; align-items: center;">
												<span>width:</span>
												<input type="number" min="0.5" max="10" step="0.5" value="${conf.width}" onchange="update_line_conf('${safe_name_js}', 'width', this.value)" style="width: 45px;">
										</div>
										<select onchange="update_line_conf('${safe_name_js}', 'style', this.value)">
												<option value="solid" ${conf.style === 'solid' ? 'selected' : ''}>solid</option>
												<option value="dashed" ${conf.style === 'dashed' ? 'selected' : ''}>dashed</option>
										</select>
								</div>`;
			});
			document.getElementById('lineSettings').innerHTML = html;
		}

		function update_line_conf(series_name, key, value) {
			line_configs[series_name][key] = value;
			generate_plot();
		}

		function generate_plot() {
			const container = document.getElementById('plotContainer');
			if (!container || parsed_series.length === 0) return;

			const scale_method = document.getElementById('scaleMethod').value;
			const legend_pos = document.getElementById('legendPos').value;
			const show_x_grid = document.getElementById('showXGrid').checked;
			const show_y_grid = document.getElementById('showYGrid').checked;
			const export_styles = document.getElementById('exportStyles').checked;

			const x_density = parseInt(document.getElementById('xTickDensity').value);
			const y_density = parseInt(document.getElementById('yTickDensity').value);
			const int_ticks_only = document.getElementById('intTicksOnly').checked;

			const l_top = document.getElementById('labelTop').value.trim();
			const l_bottom = document.getElementById('labelBottom').value.trim();
			const l_left = document.getElementById('labelLeft').value.trim();
			const l_right = document.getElementById('labelRight').value.trim();

			const is_log_x = scale_method.includes('logX');
			const is_log_y = scale_method.includes('logY');

			let processed_data = parsed_series.map(s => {
				let pts = s.points.filter(p => (!is_log_x || p.x > 0) && (!is_log_y || p.y > 0)).map(p => ({
					x: is_log_x ? Math.log10(p.x) : p.x,
					y: is_log_y ? Math.log10(p.y) : p.y
				}));
				return { name: s.name, points: pts };
			});

			let min_x = Infinity, max_x = -Infinity, min_y = Infinity, max_y = -Infinity;
			processed_data.forEach(s => {
				s.points.forEach(p => {
					if (p.x < min_x) min_x = p.x; if (p.x > max_x) max_x = p.x;
					if (p.y < min_y) min_y = p.y; if (p.y > max_y) max_y = p.y;
				});
			});

			if (min_x === Infinity) return;
			if (max_x === min_x) { min_x -= 1; max_x += 1; }
			if (max_y === min_y) { min_y -= 1; max_y += 1; }

			const clip_id = 'clip-' + Math.random().toString(36).substr(2, 9);
			let x_ticks = calculate_ticks(min_x, max_x, x_density, int_ticks_only);
			let y_ticks = calculate_ticks(min_y, max_y, y_density, int_ticks_only);

			let formatted_y_ticks = y_ticks.map(v => format_number(is_log_y ? Math.pow(10, v) : v));
			let max_y_char_len = Math.max(...formatted_y_ticks.map(s => s.length));
			let dyn_left = (max_y_char_len * 6.5) + (l_left ? 25 : 10) + plot_config.y_axis_text_gap;
			let pad_left = Math.max(plot_config.min_pad_left, dyn_left);

			let html_str = `<div class="responsive-plot-wrapper">\n`;

			html_str += `  <div class="plot-area" style="top: ${plot_config.pad_top}px; bottom: ${plot_config.pad_bottom}px; left: ${pad_left}px; right: ${plot_config.pad_right}px;">\n`;

			html_str += `    <svg class="plot-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">\n`;
			html_str += `      <defs>\n`;
			html_str += `        <clipPath id="${clip_id}"><rect x="0" y="0" width="1000" height="1000" /></clipPath>\n`;
			html_str += `      </defs>\n`;

			if (show_x_grid || show_y_grid) {
				html_str += `      <g class="grid-lines">\n`;
				if (show_x_grid) {
					x_ticks.forEach(val_x => {
						let pct_x = ((val_x - min_x) / (max_x - min_x)) * 100;
						if (pct_x > 0 && pct_x <= 100) html_str += `        <line class="plot-grid" x1="${pct_x * 10}" y1="0" x2="${pct_x * 10}" y2="1000" />\n`;
					});
				}
				if (show_y_grid) {
					y_ticks.forEach(val_y => {
						let pct_y = (1 - ((val_y - min_y) / (max_y - min_y))) * 100;
						if (pct_y >= 0 && pct_y < 100) html_str += `        <line class="plot-grid" x1="0" y1="${pct_y * 10}" x2="1000" y2="${pct_y * 10}" />\n`;
					});
				}
				html_str += `      </g>\n`;
			}

			html_str += `      <g class="data-series" clip-path="url(#${clip_id})">\n`;
			processed_data.forEach(s => {
				if (s.points.length === 0) return;
				let conf = line_configs[s.name];
				let dash_array = conf.style === 'dashed' ? 'stroke-dasharray="10,8"' : '';

				let points_str = s.points.map(p => {
					let map_x = ((p.x - min_x) / (max_x - min_x)) * 1000;
					let map_y = (1 - ((p.y - min_y) / (max_y - min_y))) * 1000;
					return `${map_x},${map_y}`;
				}).join(' ');

				html_str += `        <polyline points="${points_str}" fill="none" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke" stroke="${conf.color}" stroke-width="${conf.width}" ${dash_array} />\n`;
			});
			html_str += `      </g>\n`;
			html_str += `    </svg>\n`;

			x_ticks.forEach(val_x => {
				let pct_x = ((val_x - min_x) / (max_x - min_x)) * 100;
				if (pct_x >= 0 && pct_x <= 100) {
					let real_x = is_log_x ? Math.pow(10, val_x) : val_x;
					let str_x = format_number(real_x);

					let transform_str = "translateX(-50%)";
					if (pct_x < 1) transform_str = "translateX(0)";
					else if (pct_x > 99) transform_str = "translateX(-100%)";

					html_str += `    <div class="tick-mark-x" style="left: ${pct_x}%;"></div>\n`;
					html_str += `    <div class="tick-text-x" style="left: ${pct_x}%; transform: ${transform_str};">${str_x}</div>\n`;
				}
			});

			y_ticks.forEach(val_y => {
				let pct_y = (1 - ((val_y - min_y) / (max_y - min_y))) * 100;
				if (pct_y >= 0 && pct_y <= 100) {
					let real_y = is_log_y ? Math.pow(10, val_y) : val_y;
					let str_y = format_number(real_y);
					html_str += `    <div class="tick-mark-y" style="top: ${pct_y}%;"></div>\n`;
					html_str += `    <div class="tick-text-y" style="top: ${pct_y}%;">${str_y}</div>\n`;
				}
			});

			if (processed_data.length > 0 && legend_pos !== 'none') {
				let leg_placement = legend_pos === 'topLeft' ? 'top: 8px; left: 8px;' : 'top: 8px; right: 8px;';
				html_str += `    <div class="plot-legend" style="${leg_placement}">\n`;
				processed_data.forEach(s => {
					let conf = line_configs[s.name];
					let border_style = conf.style === 'dashed' ? 'dashed' : 'solid';
					html_str += `      <div class="legend-item">\n`;
					html_str += `        <div class="legend-swatch" style="border-top: ${conf.width}px ${border_style} ${conf.color};"></div>\n`;
					html_str += `        <span>${s.name}</span>\n`;
					html_str += `      </div>\n`;
				});
				html_str += `    </div>\n`;
			}

			html_str += `  </div>\n`;

			if (l_top) html_str += `  <div class="plot-label" style="top: ${plot_config.label_offset_top}; left: 50%; transform: translateX(-50%);">${l_top}</div>\n`;
			if (l_bottom) html_str += `  <div class="plot-label" style="bottom: ${plot_config.label_offset_bottom}; left: 50%; transform: translateX(-50%);">${l_bottom}</div>\n`;
			if (l_left) html_str += `  <div class="plot-label" style="left: ${plot_config.label_offset_left}; top: 50%; transform: translate(-50%, -50%) rotate(-90deg);">${l_left}</div>\n`;
			if (l_right) html_str += `  <div class="plot-label" style="right: ${plot_config.label_offset_right}; top: 50%; transform: translate(50%, -50%) rotate(90deg);">${l_right}</div>\n`;

			html_str += `</div>`;

			const style_block = `<style>.responsive-plot-wrapper{position:relative;width:100%;height:100%;min-height:350px;box-sizing:border-box}.plot-area{position:absolute;border-left:1px solid black;border-bottom:1px solid black;box-sizing:border-box}.plot-svg{width:100%;height:100%;display:block;overflow:visible}.plot-grid{stroke:#e0e0e0;stroke-width:1;vector-effect:non-scaling-stroke}.tick-mark-x{position:absolute;top:100%;width:1px;height:4px;background:black;transform:translateX(-50%)}.tick-text-x{position:absolute;top:calc(100% + 7px);color:black;white-space:nowrap}.tick-mark-y{position:absolute;right:100%;width:4px;height:1px;background:black;transform:translateY(-50%)}.tick-text-y{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);white-space:nowrap}.plot-label{position:absolute}.plot-legend{position:absolute;background:white;border:1px solid #8F8F9D;padding:2px 4px;display:flex;flex-direction:column;font-size:10px;z-index:10}.legend-item{margin-top:unset;margin-bottom:unset;display:flex;align-items:center;gap:0px 5px}.legend-swatch{width:14px;height:0}</style>\n`;

			const final_code = (export_styles ? style_block : '') + html_str;

			container.innerHTML = html_str;
			document.getElementById('outputCode').value = final_code;
		}

		function copy_snippet() {
			const code = document.getElementById('outputCode');
			code.select();
			code.setSelectionRange(0, 99999);
			navigator.clipboard.writeText(code.value).then(() => {
				const btn = document.getElementById('copyBtn');
				const original_text = btn.innerText;
				btn.innerText = "copied";
				setTimeout(() => { btn.innerText = original_text; btn.style.color = ""; }, 1000);
			});
		}
	</script>
</body>
